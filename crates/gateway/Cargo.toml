[package]
name = "gateway"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tensorzero-core = { path = "../tensorzero-core", default-features = false }
tensorzero-optimizers = { path = "../tensorzero-optimizers", optional = true }
evaluations = { path = "../evaluations", optional = true }
axum = { workspace = true }
tracing = { version = "0.1.43", features = ["log", "release_max_level_debug"] }
tokio = { workspace = true }
tokio-util = { workspace = true }
mimalloc = "0.1.50"
clap = { workspace = true }
tower-http = { workspace = true, features = ["metrics", "decompression-gzip", "decompression-br", "decompression-zstd"] }
metrics-exporter-prometheus = { workspace = true }
http = { workspace = true }
futures = { workspace = true }
tokio-stream = { workspace = true }
tensorzero-auth = { path = "../tensorzero-auth" }
autopilot-client = { path = "../autopilot-client", optional = true }
autopilot-worker = { path = "../autopilot-worker", optional = true }
autopilot-tools = { path = "../autopilot-tools", optional = true }
durable-tools = { path = "../durable-tools", optional = true }
tensorzero-mcp = { path = "../tensorzero-mcp", optional = true }
sqlx = { version = "0.9.0-alpha.1", features = ["sqlx-toml", "postgres", "runtime-tokio", "chrono"] }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
ts-rs.workspace = true
async-stream = { workspace = true }
http-body-util = { workspace = true }

[lints]
workspace = true

[features]
default = ["lp-slim-gateway"]
lp-slim-gateway = ["tensorzero-core/lp-slim-core"]
full-gateway = [
  "dep:autopilot-client",
  "dep:autopilot-tools",
  "dep:autopilot-worker",
  "dep:durable-tools",
  "dep:evaluations",
  "dep:tensorzero-mcp",
  "dep:tensorzero-optimizers",
  "tensorzero-core/full-gateway",
]
e2e_tests = [
  "full-gateway",
  "tensorzero-core/e2e_tests",
  "autopilot-worker/e2e_tests",
  "autopilot-tools/e2e_tests",
  "tensorzero-mcp/e2e_tests",
]

[dev-dependencies]
googletest = { workspace = true }
rmcp = { version = "1.6.0", features = [
    "client",
    "transport-streamable-http-client-reqwest",
] }
reqwest.workspace = true
tempfile = { workspace = true }
tensorzero = { path = "../tensorzero-client", features = ["e2e_tests"] }
serde_json = { workspace = true }
reqwest-sse-stream = { workspace = true }
futures = { workspace = true }
secrecy = { workspace = true }
uuid = { workspace = true }
tensorzero-unsafe-helpers = { path = "../tensorzero-unsafe-helpers" }
flate2 = "1.1.8"
zstd = "0.13.3"
brotli = "8.0.2"
